<main id="gnoMapsApp" class="gnome-maps" aria-label="Cartes">
    <header class="gnome-maps__header">
        <div class="gnome-maps__search-wrap">
            <span class="gnome-maps__search-icon" aria-hidden="true"></span>
            <input type="search" class="gnome-maps__search" placeholder="Rechercher un lieu…" aria-label="Rechercher" autocomplete="off">
        </div>
    </header>
    <section class="gnome-maps__body">
        <div class="gnome-maps__canvas" aria-label="Carte OpenStreetMap">
            <p class="gnome-maps__placeholder">Carte — vue simulée</p>
        </div>
        <aside class="gnome-maps__sidebar" hidden>
            <h3 class="gnome-maps__place-name">Paris, France</h3>
            <p class="gnome-maps__place-detail">Île-de-France</p>
        </aside>
    </section>
</main>
