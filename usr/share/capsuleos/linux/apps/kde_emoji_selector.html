<main id="kdeEmojiApp" class="kde-emoji-selector" aria-label="Sélecteur d'émoticônes">
    <header class="kde-emoji-selector__header">
        <input type="search" class="kde-emoji-selector__search" placeholder="Rechercher…" aria-label="Rechercher un émoji">
    </header>
    <section class="kde-emoji-selector__body">
        <div class="kde-emoji-selector__grid" aria-label="Émoticônes">
            <span>😀</span><span>😂</span><span>🥰</span><span>🤔</span><span>👍</span><span>❤️</span><span>🎉</span><span>🔥</span>
        </div>
    </section>
</main>
