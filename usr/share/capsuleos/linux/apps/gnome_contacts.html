<main id="gnomeContactsApp" class="gnome-contacts" aria-label="Contacts">
    <header class="gnome-contacts__header">
        <div class="gnome-contacts__search-wrap">
            <span class="gnome-contacts__search-icon" aria-hidden="true"></span>
            <input type="search" class="gnome-contacts__search" placeholder="Rechercher…" aria-label="Rechercher un contact" autocomplete="off">
        </div>
        <button type="button" class="gnome-contacts__add" aria-label="Nouveau contact">+</button>
    </header>
    <section class="gnome-contacts__body">
        <ul class="gnome-contacts__list" aria-label="Contacts">
            <li class="gnome-contacts__item"><span class="gnome-contacts__avatar">C</span><span class="gnome-contacts__name">Capsule</span></li>
        </ul>
    </section>
</main>
