<main id="gnomeWeatherApp" class="gnome-weather" aria-label="Météo">
    <header class="gnome-weather__header">
        <h1 class="gnome-weather__city">Paris</h1>
        <button type="button" class="gnome-weather__add" aria-label="Ajouter une ville">+</button>
    </header>
    <section class="gnome-weather__body">
        <div class="gnome-weather__current">
            <span class="gnome-weather__temp">18°</span>
            <span class="gnome-weather__desc">Partiellement nuageux</span>
            <span class="gnome-weather__icon" aria-hidden="true">⛅</span>
        </div>
        <ul class="gnome-weather__forecast" aria-label="Prévisions">
            <li><span>Lun</span><span>20°</span></li>
            <li><span>Mar</span><span>22°</span></li>
            <li><span>Mer</span><span>19°</span></li>
            <li><span>Jeu</span><span>17°</span></li>
            <li><span>Ven</span><span>21°</span></li>
        </ul>
    </section>
</main>
