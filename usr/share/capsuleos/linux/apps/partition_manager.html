<main id="kdePartitionApp" class="kde-partition" aria-label="Gestionnaire de partitions">
    <header class="kde-partition__header">
        <nav class="kde-partition__menubar">
            <span>Fichier</span><span>Édition</span><span>Affichage</span><span>Appareil</span><span>Partition</span><span>Aide</span>
        </nav>
    </header>
    <section class="kde-partition__body">
        <div class="kde-partition__devices">
            <h3>/dev/sda — 500 Go</h3>
            <div class="kde-partition__bar" aria-label="Partitions">
                <span class="kde-partition__part" style="flex:3" title="/ (ext4) 450 Go">/ (ext4)</span>
                <span class="kde-partition__part kde-partition__part--swap" style="flex:1" title="swap 50 Go">swap</span>
            </div>
        </div>
    </section>
</main>
